name: Build JAR

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Compile and Package JAR
      run: |
        mkdir -p build/classes
        javac -source 1.3 -target 1.3 -bootclasspath /usr/lib/jvm/java-8-openjdk-amd64/jre/lib/rt.jar ChatIoMIDlet.java -d build/classes
        cd build/classes
        jar cvf Chat.Io.jar *
        mkdir -p ../../output
        mv Chat.Io.jar ../../output/
    - name: Upload JAR
      uses: actions/upload-artifact@v3
      with:
        name: Chat.Io-jar
        path: output/Chat.Io.jar
        
